<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Dashboard</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>
<main class="users-page">

  <header class="app-header">

    <div class="app-header__top">
      <button class="app-header__menu" type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>
      <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>

    <span class="users-header-bar__title">PAGOS/ DETALLE #P001</span>

  </header>

  <section class="users-content">

    <div class="form-card">
      <h3 class="form-card__title">Detalle del Pago #P001</h3>

      <div class="profile-data profile-data--left">
        <p class="profile-data__row">ID de pago: #P001</p>
        <p class="profile-data__row">Pedido asociado: #1001</p>
      </div>

      <button type="button" class="btn-primary-custom btn-primary-custom--secondary btn-primary-custom--sm">
        <i class="bi bi-eye"></i> Ver pedido completo
      </button>

      <div class="profile-data profile-data--left" style="margin-top: 16px;">
        <p class="profile-data__row">Cliente: María González</p>
        <p class="profile-data__row">Monto: $70.00</p>
        <p class="profile-data__row">Método: Efectivo</p>
        <p class="profile-data__row">Fecha: 25/10/2023</p>
        <p class="profile-data__row">
          Estado: <span class="badge-status badge-status--completo">Completo</span>
        </p>
      </div>

      <div class="form-actions form-actions--end">
        <button type="button" class="btn-primary-custom">Editar</button>
        <button type="button" class="btn-primary-custom btn-primary-custom--secondary">Volver</button>
      </div>

    </div>

  </section>

</main>



  
    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
