<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los Hilos de Maya - Iniciar Sesión</title>
  
  <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

  <!-- Bootstrap CSS (CDN) -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <!-- Estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
  <link rel="stylesheet" href="../01_styles/base.css">
  <link rel="stylesheet" href="../01_styles/components.css">
  <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

    <main class="login-page">

      <!--Login-->
      <!-- Header / Sección Superior -->

    <header class="login-header text-center">
        <img src="../02_assets/img/Logo-no-texto.jpg" alt="Logo Los Hilos de Maya" class="login-header__logo">
        <h1 class="login-header__brand">Los Hilos de Maya</h1>
    </header>

    <!-- Tarjeta de login: contiene formulario de acceso -->

    <section class="login-card text-center">
        <h2 class="login-card__title mt-5 mb-5">INICIAR SESIÓN</h2>

        <form class="login-form mb-5" action="#" method="post">
            <div class="login-form__group">
                <input 
                    type="text"
                    id="usuario"
                    name="usuario"
                    class="login-form__input rounded"
                    placeholder="USUARIO"
                    autocomplete="username"
                    required
                >
                <i class="bi bi-person login-form__icon"></i> 

                <br><br>

                 <input 
                    type="text"
                    id="password"
                    name="password"
                    class="login-form__input rounded"
                    placeholder="CONTRASEÑA"
                    autocomplete="contraseña"
                    required
                >
                <i class="bi bi-eye-slash-fill login-form__icon"></i>
            </div>
            
        </form>
        
    </section>

        <button type="button" class="btn-primary-custom">Iniciar Sesión</button>


    </main>




   
  

  <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Nuestro JS -->
  <script src="../03_JS/login.js" defer></script>

</body>
</html>
