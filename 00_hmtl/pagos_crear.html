<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Dashboard</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

<main class="users-page">

  <header class="app-header">

    <div class="app-header__top">
      <button class="app-header__menu" type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>
      <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>

    <span class="users-header-bar__title">PAGOS/ REGISTRAR NUEVO</span>

  </header>

  <section class="users-content">

    <div class="form-card">
      <h3 class="form-card__title">Registrar Nuevo Pago</h3>

      <form class="form-fields">

        <div class="form-group-custom">
          <label for="pedido" class="form-group-custom__label">Pedido</label>
          <select id="pedido" name="pedido" class="form-group-custom__input">
            <option value="" disabled selected>Buscar pedido...</option>
            <option value="1001">#1001 - María González</option>
            <option value="1002">#1002 - Juan Pérez</option>
          </select>
        </div>

        <div class="profile-data profile-data--left">
          <p class="profile-data__row">Cliente: María González</p>
          <p class="profile-data__row">Saldo pendiente: $100.00</p>
        </div>

        <div class="form-row">
          <div class="form-group-custom">
            <label for="monto" class="form-group-custom__label">Monto</label>
            <input type="number" id="monto" name="monto" class="form-group-custom__input" placeholder="$0.00">
          </div>

          <div class="form-group-custom">
            <label for="metodo" class="form-group-custom__label">Método</label>
            <select id="metodo" name="metodo" class="form-group-custom__input">
              <option value="efectivo" selected>Efectivo</option>
              <option value="transferencia">Transferencia</option>
            </select>
          </div>
        </div>

        <div class="profile-data profile-data--left">
          <p class="profile-data__row">
            Estado resultante: <span class="badge-status badge-status--completo">Completo</span>
          </p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary-custom">Guardar pago</button>
          <button type="button" class="btn-primary-custom btn-primary-custom--secondary">Cancelar</button>
        </div>

      </form>
    </div>

  </section>

</main>



  
    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
