<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Dashboard</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

<main class="users-page">

  <header class="app-header">

    <div class="app-header__top">
      <button class="app-header__menu" type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>
      <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>

    <span class="users-header-bar__title">PEDIDOS/ EDITAR PEDIDO #1001</span>

  </header>

  <section class="users-content">

    <div class="form-card">
      <h3 class="form-card__title">Editar Pedido #1001</h3>

      <form class="form-fields">

        <div class="form-group-custom">
          <label for="cliente" class="form-group-custom__label">Cliente</label>
          <input type="text" id="cliente" class="form-group-custom__input" value="María González" disabled>
        </div>

        <div class="profile-data profile-data--left">
          <p class="profile-data__row">Registrado por: Ana (Administradora)</p>
        </div>

        <div class="subsection">
          <h4 class="subsection__title">Agregar Productos</h4>

          <div class="form-row">
            <div class="form-group-custom">
              <label for="producto" class="form-group-custom__label">Producto</label>
              <select id="producto" name="producto" class="form-group-custom__input">
                <option value="" disabled selected>Buscar producto...</option>
                <option value="hilo">Hilo de Algodón Premium</option>
                <option value="tela">Tela Lino Natural</option>
              </select>
            </div>

            <div class="form-group-custom">
              <label for="cantidad" class="form-group-custom__label">Cantidad</label>
              <input type="number" id="cantidad" name="cantidad" class="form-group-custom__input" value="0">
            </div>
          </div>

          <button type="button" class="btn-primary-custom btn-primary-custom--secondary btn-primary-custom--sm">
            + Agregar producto
          </button>

          <div class="order-row">
            <div>
              <p class="order-row__id"><strong>Hilo de Algodón Premium</strong></p>
              <p class="order-row__code">Cantidad: 2 · $15.00 c/u</p>
            </div>
            <div class="order-row__actions">
              <span class="order-row__code"><strong>$30.00</strong></span>
              <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
            </div>
          </div>

          <div class="order-row">
            <div>
              <p class="order-row__id"><strong>Tela Lino Natural</strong></p>
              <p class="order-row__code">Cantidad: 1 · $40.00 c/u</p>
            </div>
            <div class="order-row__actions">
              <span class="order-row__code"><strong>$40.00</strong></span>
              <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
            </div>
          </div>

          <div class="order-row">
            <span class="order-row__id"><strong>Total</strong></span>
            <span class="order-row__code"><strong>$70.00</strong></span>
          </div>
        </div>

        <div class="form-group-custom">
          <label for="estado" class="form-group-custom__label">Estado del pedido</label>
          <select id="estado" name="estado" class="form-group-custom__input">
            <option value="pendiente" selected>Pendiente</option>
            <option value="en-proceso">En proceso</option>
            <option value="enviado">Enviado</option>
            <option value="entregado">Entregado</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary-custom">Guardar cambios</button>
          <button type="button" class="btn-primary-custom btn-primary-custom--secondary">Cancelar</button>
        </div>

      </form>
    </div>

  </section>

</main>



  
    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
