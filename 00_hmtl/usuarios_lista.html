<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Lista de Usuarios</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

    <main class="users-page">

        <header class="app-header">

            <div class="app-header__top">
                <button class="app-header__menu" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>

                <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>

            <div class="users-header-bar">
                <span class="users-header-bar__title">USUARIOS</span>

                <div class="search-bar search-bar--compact">
                    <i class="bi bi-search search-bar__icon"></i>
                    <input type="search" class="search-bar__input" placeholder="Buscar..." aria-label="Buscar">
                </div>
            </div>

        </header>

        <section class="users-content">

            <div class="entity-card">
  <div class="entity-card__top">
    <div>
      <h3 class="entity-card__name">Ana Martinez</h3>
      <a href="mailto:ana@gmail.com" class="entity-card__email">ana@gmail.com</a>
    </div>
    <span class="entity-card__date">12/01/2026</span>
  </div>

  <div class="entity-card__footer">
    <span class="badge-status badge-status--admin">Administrador</span>
    <div class="entity-card__actions">
      <i class="bi bi-eye order-row__icon"></i>
      <i class="bi bi-pencil-square order-row__icon"></i>
      <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
    </div>
  </div>
</div>

<div class="entity-card">
  <div class="entity-card__top">
    <div>
      <h3 class="entity-card__name">Juan Rodriguez</h3>
      <a href="mailto:juan@gmail.com" class="entity-card__email">juan@gmail.com</a>
    </div>
    <span class="entity-card__date">12/01/2026</span>
  </div>

  <div class="entity-card__footer">
    <span class="badge-status badge-status--admin">Administrador</span>
    <div class="entity-card__actions">
      <i class="bi bi-eye order-row__icon"></i>
      <i class="bi bi-pencil-square order-row__icon"></i>
      <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
    </div>
  </div>
</div>

<div class="entity-card">
  <div class="entity-card__top">
    <div>
      <h3 class="entity-card__name">Cristian</h3>
      <a href="mailto:cristian@gmail.com" class="entity-card__email">cristian@gmail.com</a>
    </div>
    <span class="entity-card__date">12/01/2026</span>
  </div>

  <div class="entity-card__footer">
    <span class="badge-status badge-status--repartidor">Repartidor</span>
    <div class="entity-card__actions">
      <i class="bi bi-eye order-row__icon"></i>
      <i class="bi bi-pencil-square order-row__icon"></i>
      <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
    </div>
  </div>
</div>
        </section>

        <button type="button" class="btn-primary-custom">Nuevo Usuario</button> 


    </main>






    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>
</body>

</html>
