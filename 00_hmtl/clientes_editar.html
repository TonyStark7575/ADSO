

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Editar cliente</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

  <main class="users-page">

  <header class="app-header">

    <div class="app-header__top">
      <button class="app-header__menu" type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>

      <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>

    <span class="users-header-bar__title">CLIENTE / EDITAR CLIENTE</span>

  </header>

  <section class="users-content">

    <div class="form-card">
      <h3 class="form-card__title">Información del cliente</h3>

      <form class="form-fields">

        <div class="form-group-custom">
          <label for="nombre" class="form-group-custom__label">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="form-group-custom__input">
        </div>

        <div class="form-group-custom">
          <label for="correo" class="form-group-custom__label">Correo</label>
          <input type="email" id="correo" name="correo" class="form-group-custom__input">
        </div>

        <div class="form-group-custom">
          <label for="telefono" class="form-group-custom__label">Telefono</label>
          <input type="tel" id="telefono" name="telefono" class="form-group-custom__input">
        </div>

        <div class="profile-data">
          <p class="profile-data__row">Registrado por: Ana (Admin)</p>
          <p class="profile-data__row">Fecha Registro: 01/01/01</p>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary-custom">Guardar cambios</button>
          <button type="button" class="btn-primary-custom btn-primary-custom--secondary">Cancelar</button>
        </div>

      </form>
    </div>

  </section>

</main>


    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
