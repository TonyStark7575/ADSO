

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Detalles del producto</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

    <main class="users-page">

  <header class="app-header">

    <div class="app-header__top">
      <button class="app-header__menu" type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>
      <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>

    <span class="users-header-bar__title">DETALLES / (NOMBRE PRODUCTO)</span>

  </header>

  <section class="users-content">

    <div class="form-card">

      <div class="image-upload" style="width: 160px; height: 160px;">
        <img src="../02_assets/img/LOGOTIPO.png" alt="Imagen del producto">
      </div>

      <div class="profile-data">
        <p class="profile-data__row"><strong>Nombre Producto</strong></p>
        <p class="profile-data__row">Precio: $ 100.000</p>
        <p class="profile-data__row"><strong>Descripción</strong></p>
        <p class="profile-data__row">
          Curabitur pretium tincidunt lacus. Nulla gravida orci a odio. Nullam vari
          Curabitur pretium tincidunt lacus. Nulla gravida orci a odio. Nullam vari
        </p>
        <p class="profile-data__row">Fecha Registro 01/01/01</p>
      </div>

      <div class="detail-actions-row">
        <button type="button" class="btn-primary-custom">
          <i class="bi bi-pencil-square"></i>
        </button>
        <button type="button" class="btn-primary-custom">
          <i class="bi bi-trash"></i>
        </button>
      </div>

    </div>

  </section>

</main>


    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
