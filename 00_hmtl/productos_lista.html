<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Lista de productods</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

   <main class="users-page">

  <header class="app-header">

    <div class="app-header__top">
      <button class="app-header__menu" type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>
      <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>

    <div class="users-header-bar">
      <span class="users-header-bar__title">PRODUCTOS</span>
      <div class="search-bar search-bar--compact">
        <i class="bi bi-search search-bar__icon"></i>
        <input type="search" class="search-bar__input" placeholder="Buscar..." aria-label="Buscar">
      </div>
    </div>

  </header>

  <button type="button" class="btn-primary-custom btn-primary-custom--pill">Nuevo Producto</button>

  <section class="users-content">

    <div class="products-grid">

      <div class="product-card">
        <div class="product-card__image">
          <img src="../02_assets/img/Logo-no-texto.jpg" alt="Bufanda Punto Cruz">
        </div>
        <p class="product-card__name">Bufanda Punto Cruz</p>
        <p class="product-card__price">$ 80.000</p>
        <div class="product-card__actions">
          <i class="bi bi-eye order-row__icon"></i>
          <i class="bi bi-pencil-square order-row__icon"></i>
          <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
        </div>
      </div>

      <div class="product-card">
        <div class="product-card__image">
          <img src="../02_assets/img/LOGOTIPO.png" alt="Amigurumi">
        </div>
        <p class="product-card__name">Amigurumi</p>
        <p class="product-card__price">$ 100.000</p>
        <div class="product-card__actions">
          <i class="bi bi-eye order-row__icon"></i>
          <i class="bi bi-pencil-square order-row__icon"></i>
          <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
        </div>
      </div>

      <div class="product-card">
        <div class="product-card__image">
          <img src="../02_assets/img/LOGOTIPO.png" alt="Atrapa Sueños">
        </div>
        <p class="product-card__name">Atrapa Sueños</p>
        <p class="product-card__price">$ 50.000</p>
        <div class="product-card__actions">
          <i class="bi bi-eye order-row__icon"></i>
          <i class="bi bi-pencil-square order-row__icon"></i>
          <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
        </div>
      </div>

      <div class="product-card">
        <div class="product-card__image">
          <img src="RUTA_IMAGEN" alt="Blusa">
        </div>
        <p class="product-card__name">Blusa</p>
        <p class="product-card__price">$ 120.000</p>
        <div class="product-card__actions">
          <i class="bi bi-eye order-row__icon"></i>
          <i class="bi bi-pencil-square order-row__icon"></i>
          <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
        </div>
      </div>

    </div>

  </section>

</main>

    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
