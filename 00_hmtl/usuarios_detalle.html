<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Detalles Usuario</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

    <main class="users-page">

        <header class="app-header">

            <div class="app-header__top">
                <button class="app-header__menu" type="button" aria-label="Abrir menú">
                    <i class="bi bi-list"></i>
                </button>

                <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>

            <span class="users-header-bar__title">USUARIOS / DETALLES</span>

        </header>

        <section class="users-content">

            <div class="form-card">
                <div class="detail-header text-center">
                    <h3 class="form-card__title">Perfil del Usuario</h3>
                    <i class="bi bi-pencil-square detail-header__edit-icon"></i>
                </div>

                <div class="profile-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>

                <div class="profile-data ">
                    <p class="profile-data__row"><strong>Nombre:</strong> Ana</p>
                    <p class="profile-data__row"><strong>Correo:</strong> ana@gmail.com</p>
                    <p class="profile-data__row"><strong>Rol:</strong> Administrador</p>
                    <p class="profile-data__row"><strong>Fecha de registro:</strong> 01/01/01</p>
                </div>

                
            </div>

            <div class="form-actions form-actions--center">
  <button type="button" class="btn-primary-custom btn-primary-custom--secondary">Volver</button>
</div>

        </section>

    </main>


    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
