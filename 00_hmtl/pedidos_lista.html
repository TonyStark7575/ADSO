
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Hilos de Maya - Dashboard</title>

    <!-- Google Fonts: Caveat (fuente cursiva temporal para el logo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">



    <!-- Nuestros estilos propios (van DESPUÉS de Bootstrap para poder sobreescribirlo) -->
    <link rel="stylesheet" href="../01_styles/base.css">
    <link rel="stylesheet" href="../01_styles/components.css">
    <link rel="stylesheet" href="../01_styles/pages.css">
</head>

<body>

    <main class="users-page">

  <header class="app-header">

    <div class="app-header__top">
      <button class="app-header__menu" type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
      </button>
      <button class="app-header__logout" type="button" aria-label="Cerrar sesión">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>

    <div class="users-header-bar">
      <span class="users-header-bar__title">PEDIDOS</span>
      <div class="search-bar search-bar--compact">
        <i class="bi bi-search search-bar__icon"></i>
        <input type="search" class="search-bar__input" placeholder="Buscar..." aria-label="Buscar">
      </div>
    </div>

  </header>

  <section class="users-content">

    <div class="filter-pills">
      <button type="button" class="filter-pill filter-pill--en-proceso">En proceso</button>
      <button type="button" class="filter-pill filter-pill--pendiente">Pendientes</button>
      <button type="button" class="filter-pill filter-pill--entregado">Entregados</button>
    </div>

    <div class="entity-card">
      <div class="entity-card__top">
        <p class="entity-card__detail">ID: 1001</p>
        <span class="badge-status badge-status--entregado">Entregado</span>
      </div>
      <p class="entity-card__detail">Cliente: Maria Gonzáles</p>
      <p class="entity-card__detail">Tel: 123-742-25</p>

      <div class="entity-card__footer">
        <div></div>
        <div class="entity-card__actions">
          <i class="bi bi-eye order-row__icon"></i>
          <i class="bi bi-pencil-square order-row__icon"></i>
          <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
        </div>
      </div>
    </div>

    <div class="entity-card">
      <div class="entity-card__top">
        <p class="entity-card__detail">ID: 1002</p>
        <span class="badge-status badge-status--pendiente">Pendiente</span>
      </div>
      <p class="entity-card__detail">Cliente: Juan Gomez</p>
      <p class="entity-card__detail">Tel: 123-742-25</p>

      <div class="entity-card__footer">
        <div></div>
        <div class="entity-card__actions">
          <i class="bi bi-eye order-row__icon"></i>
          <i class="bi bi-pencil-square order-row__icon"></i>
          <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
        </div>
      </div>
    </div>

    <div class="entity-card">
      <div class="entity-card__top">
        <p class="entity-card__detail">ID: 1003</p>
        <span class="badge-status badge-status--en-proceso">En proceso</span>
      </div>
      <p class="entity-card__detail">Cliente: Cristian Ramos</p>
      <p class="entity-card__detail">Tel: 123-742-25</p>

      <div class="entity-card__footer">
        <div></div>
        <div class="entity-card__actions">
          <i class="bi bi-eye order-row__icon"></i>
          <i class="bi bi-pencil-square order-row__icon"></i>
          <i class="bi bi-trash order-row__icon order-row__icon--delete"></i>
        </div>
      </div>
    </div>

  </section>

  <button type="button" class="btn-primary-custom">Nuevo Pedido</button>

</main>


    <!-- Bootstrap JS (Bundle incluye Popper, necesario para dropdowns, modales, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JS -->
    <script src="../03_JS/login.js" defer></script>


</body>

</html>
